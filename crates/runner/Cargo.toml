[package]
name = "pastille-run"
description = "Runs a saved circuit without a browser, for testing the solver"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Not on crates.io: the crates are the app's, not a library for others.
publish = false

[[bin]]
name = "pastille-run"
path = "src/main.rs"

[dependencies]
pastille-core.workspace = true
serde_json = "1"
